name: CI

on:
  push:
    branches:
      - main
      - extension
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # run all commands in the `extension/` folder
    defaults:
      run:
        working-directory: extension

    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Use Node.js 18
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Bundle the popup
        run: npm run build

      - name: Run tests
        run: npm test
